<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Paleta de colores - La Prosperidad</title>
  <link rel="stylesheet" href="palette.css">
  <style>
    .color-grid {
      display: flex;
      gap: 16px;
      padding: 20px;
      font-family: Arial, sans-serif;
:root {
  --azul-oscuro: #0B3A78;
  --verde:       #32B26C;
  --fucsia:      #E83F6F;
  --naranja:     #F4A640;
  --blanco:      #FFFFFF;
}

  </style>
</head>
<body>
  <h1>Paleta de colores</h1>
  <div class="color-grid">
    <div class="color-box" style="background-color: #0B3A78; color: #FFFFFF;">
      Azul oscuro<br>#0B3A78
    </div>

    <div class="color-box" style="background-color: #32B26C; color: #FFFFFF;">
      Verde<br>#32B26C
    </div>

    <div class="color-box" style="background-color: #E83F6F; color: #FFFFFF;">
      Fucsia<br>#E83F6F
    </div>

    <div class="color-box" style="background-color: #F4A640; color: #000000;">
      Naranja<br>#F4A640
    </div>

    <div class="color-box" style="background-color: #FFFFFF; color: #000000; border: 1px solid #ccc;">
      Blanco<br>#FFFFFF
    </div>
  </div>
</body>
</html>
