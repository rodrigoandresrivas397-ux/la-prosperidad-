<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Papelería La Prosperidad</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1E5BC6 0%, #0d3a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 44px 40px;
      width: 380px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .logo {
      width: 70px; height: 70px;
      background: #1E5BC6;
      border-radius: 14px;
      margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
    }
    h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #1E5BC6;
    }
    .subtitle {
      font-size: 12px;
      color: #6B7280;
      margin: 4px 0 28px;
    }
    .form-group { text-align: left; margin-bottom: 18px; }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #6B7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      border: 1.5px solid #E5E7EB;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: border 0.2s;
      color: #333;
    }
    input:focus { border-color: #1E5BC6; }
    .btn-login {
      width: 100%;
      background: #1E5BC6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #1649a8; }
    .btn-forgot {
      background: none;
      border: none;
      color: #1E5BC6;
      font-size: 12px;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      margin-top: 14px;
      display: block;
      width: 100%;
      text-align: center;
    }
    .btn-forgot:hover { text-decoration: underline; }
    .footer {
      font-size: 10px;
      color: #aaa;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📎</div>
    <h1>Papelería La Prosperidad</h1>
    <p class="subtitle">Sistema Integral de Gestión</p>

    <div class="form-group">
      <label>Usuario</label>
      <input type="text" placeholder="Ingrese su usuario">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" placeholder="••••••••">
    </div>

    <button class="btn-login" onclick="window.location.href='dashboard.html'">Iniciar Sesión</button>
    <button class="btn-forgot">¿Olvidó su contraseña?</button>

    <p class="footer">Versión 1.0 &copy; 2026 Papelería La Prosperidad</p>
  </div>
</body>
</html>
